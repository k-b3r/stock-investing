services:
  postgres:
    image: postgres:16
    container_name: stocks-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: stocks
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: psei_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stocks
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: psei_app
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
